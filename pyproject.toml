[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contrastive-activation-sae"
version = "0.1.0"
description = "A minimal high/low Split TopK SAE trained contrastively on Gemma residual activations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "datasets>=2.20",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
csae-extract = "contrastive_sae.extract_activations:main"
csae-train = "contrastive_sae.train:main"
csae-evaluate = "contrastive_sae.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

